name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# إلغاء التشغيلات القديمة عند push جديد
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"
  GOTOOLCHAIN: local

jobs:
  # ═══════════════════════════════════════════════
  # 1. Verify — التحقق الأساسي
  # ═══════════════════════════════════════════════
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod
        run: |
          go mod verify
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "❌ go.mod or go.sum is not tidy"
            git diff go.mod go.sum
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  # ═══════════════════════════════════════════════
  # 2. Test — الاختبارات
  # ═══════════════════════════════════════════════
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-gormz
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 7

  # ═══════════════════════════════════════════════
  # 3. Lint — الفحص
  # ═══════════════════════════════════════════════
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m --config=.golangci.yml

  # ═══════════════════════════════════════════════
  # 4. Format — التحقق من التنسيق
  # ═══════════════════════════════════════════════
  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ The following files need gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check gofumpt
        run: |
          if [ -n "$(gofumpt -l .)" ]; then
            echo "❌ The following files need gofumpt:"
            gofumpt -l .
            exit 1
          fi

  # ═══════════════════════════════════════════════
  # 5. Security — الفحص الأمني
  # ═══════════════════════════════════════════════
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ═══════════════════════════════════════════════
  # 6. Status — الحالة النهائية
  # ═══════════════════════════════════════════════
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [verify, test, lint, format, security]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.verify.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.format.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "❌ Some jobs failed"
            exit 1
          fi
          echo "✅ All jobs passed"