# ═══════════════════════════════════════════════════════════════════
#  golangci-lint configuration for gormz
#  Docs: https://golangci-lint.run/usage/configuration/
# ═══════════════════════════════════════════════════════════════════

# ─── الإعدادات العامة ───────────────────────────────────────────────
run:
  # المهلة الزمنية للتحليل
  timeout: 5m
  
  # عدد الأنوية المستخدمة (0 = كل الأنوية)
  concurrency: 4
  
  # تحليل ملفات الاختبار أيضاً
  tests: true
  
  # مسار build cache
  build-tags:
    - integration
    - e2e
  
  # تخطي المجلدات
  skip-dirs:
    - vendor
    - testdata
    - examples
    - docs
    - .git
    - .github
    - tmp
    - bin
    - dist
  
  # تخطي الملفات
  skip-files:
    - ".*\\.pb\\.go$"
    - ".*_gen\\.go$"
    - ".*\\.gen\\.go$"
  
  # لغة التحليل
  modules-download-mode: readonly
  
  # السماح بالتوازي
  allow-parallel-runners: true
  
  # التحقق من الأخبار
  go: '1.22'

# ─── الإعدادات العامة للمخرجات ──────────────────────────────────────
output:
  # تنسيق المخرجات
  formats:
    - format: colored-line-number
      path: stdout
  
  # طباعة الأخطاء التي تم فحصها
  print-issued-lines: true
  
  # طباعة اسم الـ linter
  print-linter-name: true
  
  # ترتيب النتائج
  sort-results: true
  
  # إظهار الإحصائيات
  show-stats: true
  
  # حد أقصى للمشاكل المعروضة (0 = لا حد)
  max-issues-per-linter: 50
  max-same-issues: 10

# ═══════════════════════════════════════════════════════════════════
#  Linters — المفعّلة
# ═══════════════════════════════════════════════════════════════════
linters:
  # تعطيل كل الـ linters الافتراضية
  disable-all: true
  
  # تفعيل ما نريد فقط
  enable:
    # ─── أساسية ────────────────────────────────────────────────────
    - errcheck        # التحقق من الأخطاء غير المعالجة
    - gosimple        # تبسيط الكود
    - govet           # التحقق من الصحة (go vet)
    - ineffassign     # اكتشاف الإسنادات غير المستخدمة
    - staticcheck     # تحليل ثابت متقدم
    - unused          # اكتشاف الكود غير المستخدم
    
    # ─── التنسيق ───────────────────────────────────────────────────
    - gofmt           # تنسيق Go
    - goimports       # تنظيم الاستيرادات
    - gofumpt         # تنسيق صارم (أفضل من gofmt)
    - whitespace      # اكتشاف المسافات الزائدة
    
    # ─── الجودة ────────────────────────────────────────────────────
    - misspell        # الأخطاء الإملائية
    - gocritic        # نصائح تحسين الكود
    - revive          # بديل golint
    - stylecheck      # التحقق من الأسلوب
    - unconvert       # تحويلات غير ضرورية
    - unparam         # بارامترات غير مستخدمة
    - predeclared     # أسماء معرّفة مسبقاً
    - prealloc        # تحسين تخصيص الشرائح
    - nakedret        # return مكشوف
    - nilerr          # return nil عند وجود خطأ
    - nilnil          # return nil, nil
    - noctx           # طلبات HTTP بدون context
    - nolintlint      # استخدام nolint بشكل صحيح
    - thelper         # مساعدات الاختبار
    - tparallel       # parallel tests
    - usestdlibvars  # استخدام متغيرات stdlib
    
    # ─── الأمان ────────────────────────────────────────────────────
    - gosec           # فحص أمني
    - bodyclose       # إغلاق body في HTTP
    - rowserrcheck    # التحقق من rows.Err()
    - sqlclosecheck   # إغلاق sql.Rows
    - contextcheck    # فحص context
    
    # ─── التعقيد ───────────────────────────────────────────────────
    - cyclop          # التعقيد السيكلومي
    - gocognit        # التعقيد المعرفي
    - gocyclo         # التعقيد الدوري
    - nestif          # if المتداخلة
    - funlen          # طول الدوال
    - maintidx        # فهرس الصيانة
    
    # ─── أداء ──────────────────────────────────────────────────────
    - perfsprint      # تحسين fmt.Sprintf
    - copyloopvar     # نسخ متغيرات الحلقة
    
    # ─── تنسيق ─────────────────────────────────────────────────────
    - dupl            # اكتشاف الكود المكرر
    - goconst         # الثوابت المتكررة
    - godot           # النقاط في التعليقات
    - godox           # TODO/FIXME
    - gci             # ترتيب الاستيرادات
    - tagalign        # محاذاة tags
    - tagliatelle     # تسمية tags
    - lll             # طول السطر
    
    # ─── وثائق ─────────────────────────────────────────────────────
    - godoclint       # تعليقات godoc
    - gomnd           # الأرقام السحرية
    
    # ─── إضافية ────────────────────────────────────────────────────
    - asasalint       # تمرير []any
    - asciicheck      # الأحرف غير ASCII
    - bidichk         # أحرف Unicode ثنائية الاتجاه
    - canonicalheader # رؤوس HTTP القياسية
    - containedctx    # context داخل struct
    - decorder        # ترتيب التعريفات
    - dogsled         # dogsled assignments
    - durationcheck   # التحقق من المدد الزمنية
    - errchkjson      # التحقق من JSON
    - errname         # تسمية الأخطاء
    - errorlint       # فحص الأخطاء
    - exhaustive      # switch شامل
    - fatcontext      # context في loops
    - forbidigo       # منع دوال معينة
    - forcetypeassert # type assertions
    - ginkgolinter    # Ginkgo
    - gocheckcompilerdirectives # compiler directives
    - gochecksumtype  # sum type
    - gomoddirectives # توجيهات go.mod
    - gomodguard      # حماية go.mod
    - goprintffuncname # تسمية print
    - grouper         # تجميع imports
    - iface           # واجهات
    - importas        # aliases
    - interfacebloat  # واجهات ضخمة
    - intrange        # range على int
    - loggercheck     # فحص loggers
    - makezero        # make مع length
    - mirror          # bytes/strings
    - musttag         # tags إلزامية
    - nonamedreturns  # return مسمّى
    - nosprintfhostport # host:port
    - promlinter      # Prometheus
    - protogetter     # protobuf getters
    - reassign        # إعادة تعيين
    - sloglint        # slog
    - spancheck       # spans
    - sqlclosecheck   # sql rows
    - tenv            # t.Setenv
    - testableexamples # examples
    - testifylint     # testify
    - testpackage     # package اختبار
    - tparallel       # parallel
    - wastedassign    # إسنادات مهدورة
    - zerologlint     # zerolog
    
  # ─── Linters السريعة (Fast) ─────────────────────────────────────
  fast: false

# ═══════════════════════════════════════════════════════════════════
#  Linters Settings — إعدادات كل linter
# ═══════════════════════════════════════════════════════════════════
linters-settings:
  # ─── errcheck ────────────────────────────────────────────────────
  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - (*database/sql.DB).Close
      - (io.Closer).Close
      - fmt.Print
      - fmt.Println
      - fmt.Printf
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
  
  # ─── govet ───────────────────────────────────────────────────────
  govet:
    enable-all: true
    disable:
      - fieldalignment  # كشف misalignment
      - shadow          # shadowed variables
    settings:
      printf:
        funcs:
          - (github.com/light-tech-dev/gormz/internal.Logger).Infof
          - (github.com/light-tech-dev/gormz/internal.Logger).Warnf
          - (github.com/light-tech-dev/gormz/internal.Logger).Errorf
          - (github.com/light-tech-dev/gormz/internal.Logger).Debugf
  
  # ─── staticcheck ─────────────────────────────────────────────────
  staticcheck:
    checks:
      - "all"
      - "-ST1000"  # package comment
      - "-ST1003"  # naming
      - "-ST1016"  # receiver names
      - "-ST1020"  # comment on exported
      - "-ST1021"  # comment on exported type
      - "-ST1022"  # comment on exported var
      - "-ST1023"  # omit type
  
  # ─── gosimple ────────────────────────────────────────────────────
  gosimple:
    checks: ["all"]
  
  # ─── unused ──────────────────────────────────────────────────────
  unused:
    check-exported: true
  
  # ─── gofmt ───────────────────────────────────────────────────────
  gofmt:
    simplify: true
    rewrite-rules:
      - pattern: 'interface{}'
        replacement: 'any'
      - pattern: 'a[b:len(a)]'
        replacement: 'a[b:]'
  
  # ─── gofumpt ─────────────────────────────────────────────────────
  gofumpt:
    module-path: github.com/light-tech-dev/gormz
    extra-rules: true
  
  # ─── goimports ───────────────────────────────────────────────────
  goimports:
    local-prefixes: github.com/light-tech-dev/gormz
  
  # ─── gci (ترتيب الاستيرادات) ────────────────────────────────────
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/light-tech-dev/gormz)
      - prefix(github.com/sanad)
      - blank
      - dot
    custom-order: true
  
  # ─── misspell ────────────────────────────────────────────────────
  misspell:
    locale: US
    ignore-words:
      - sanad
      - gormz
      - strftime
      - sqlite
      - postgres
  
  # ─── gocritic ────────────────────────────────────────────────────
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - whyNoLint
      - unnamedResult
      - hugeParam
      - rangeValCopy
      - ifElseChain
      - singleCaseSwitch
    settings:
      captLocal:
        paramsOnly: false
      elseif:
        skipBalanced: true
  
  # ─── revive ──────────────────────────────────────────────────────
  revive:
    ignore-generated-header: true
    severity: warning
    confidence: 0.8
    enable-all-rules: false
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
        arguments:
          - "disableStutteringCheck"
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
        disabled: true
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
        disabled: true
      - name: unreachable-code
      - name: redefines-builtin-id
  
  # ─── stylecheck ──────────────────────────────────────────────────
  stylecheck:
    checks:
      - "all"
      - "-ST1000"
      - "-ST1003"
      - "-ST1016"
      - "-ST1020"
      - "-ST1021"
      - "-ST1022"
    dot-import-whitelist:
      - fmt
  
  # ─── cyclop ──────────────────────────────────────────────────────
  cyclop:
    max-complexity: 15
    package-average: 10.0
    skip-tests: true
  
  # ─── gocyclo ─────────────────────────────────────────────────────
  gocyclo:
    min-complexity: 15
  
  # ─── gocognit ────────────────────────────────────────────────────
  gocognit:
    min-complexity: 20
  
  # ─── nestif ──────────────────────────────────────────────────────
  nestif:
    min-complexity: 4
  
  # ─── funlen ──────────────────────────────────────────────────────
  funlen:
    lines: 100
    statements: 50
    ignore-comments: true
  
  # ─── maintidx ────────────────────────────────────────────────────
  maintidx:
    under: 20
  
  # ─── dupl ────────────────────────────────────────────────────────
  dupl:
    threshold: 100
  
  # ─── goconst ─────────────────────────────────────────────────────
  goconst:
    min-len: 3
    min-occurrences: 3
    ignore-tests: false
    match-constant: true
    numbers: true
    min: 3
    max: 3
  
  # ─── lll (طول السطر) ────────────────────────────────────────────
  lll:
    line-length: 120
    tab-width: 4
  
  # ─── gomnd ───────────────────────────────────────────────────────
  gomnd:
    checks:
      - argument
      - case
      - condition
      - operation
      - return
      - assign
    ignored-numbers:
      - '0'
      - '1'
      - '2'
      - '3'
      - '10'
      - '60'
      - '100'
      - '1000'
    ignored-files:
      - '_test.go'
  
  # ─── gosec ───────────────────────────────────────────────────────
  gosec:
    includes:
      - G101  # hardcoded credentials
      - G102  # bind to all interfaces
      - G103  # unsafe block
      - G104  # unhandled errors
      - G106  # ssh InsecureIgnoreHostKey
      - G107  # url provided to HTTP request
      - G108  # pprof endpoint
      - G109  # strconv.Atoi
      - G110  # decompression bomb
      - G111  # directory traversal
      - G112  # slowloris
      - G113  # uncontrolled consumption
      - G114  # net/http serve
      - G201  # SQL query construction
      - G202  # SQL string concatenation
      - G203  # HTML templates
      - G204  # subprocess with variable
      - G301  # file permissions
      - G302  # file permissions
      - G303  # temp file
      - G304  # file inclusion
      - G305  # zip extraction
      - G306  # file permissions
      - G307  # defer file.Close
      - G401  # weak crypto
      - G402  # TLS config
      - G403  # weak RSA
      - G404  # weak random
      - G501  # import blocklist
      - G502  # import blocklist
      - G503  # import blocklist
      - G504  # import blocklist
      - G505  # import blocklist
      - G601  # implicit memory aliasing
    excludes:
      - G104  # unhandled errors (handled by errcheck)
      - G307  # defer file.Close (handled by errcheck)
    config:
      G306:
        # file permissions
        pattern: '0600'
    severity: medium
    confidence: medium
  
  # ─── bodyclose ───────────────────────────────────────────────────
  bodyclose:
    check-exported: true
  
  # ─── contextcheck ────────────────────────────────────────────────
  contextcheck:
    check-function:
      - (github.com/light-tech-dev/gormz.QuerySet).All
      - (github.com/light-tech-dev/gormz.QuerySet).First
      - (github.com/light-tech-dev/gormz.QuerySet).Create
      - (github.com/light-tech-dev/gormz.QuerySet).Update
      - (github.com/light-tech-dev/gormz.QuerySet).Delete
  
  # ─── errorlint ───────────────────────────────────────────────────
  errorlint:
    errorf: true
    asserts: true
    comparison: true
  
  # ─── exhaustive ──────────────────────────────────────────────────
  exhaustive:
    check:
      - switch
      - map
    default-signifies-exhaustive: true
    ignore-enum-members: "Example.+"
    ignore-enum-types: "Example.+"
    package-scope-only: false
  
  # ─── forbidigo ───────────────────────────────────────────────────
  forbidigo:
    forbid:
      - 'fmt\.Print.*'
      - 'println'
      - 'panic\('
    exclude-godoc-examples: true
    analyze-types: true
  
  # ─── gomodguard ──────────────────────────────────────────────────
  gomodguard:
    allowed:
      modules: []
      domains: []
    blocked:
      modules:
        - github.com/golang/lint:
            recommendations:
              - golang.org/x/lint
        - github.com/stretchr/testify:
            recommendations:
              - github.com/stretchr/testify/assert
      versions: []
  
  # ─── importas ────────────────────────────────────────────────────
  importas:
    no-unaliased: true
    no-extra-aliases: false
    alias:
      - pkg: github.com/light-tech-dev/gormz
        alias: gormz
      - pkg: github.com/light-tech-dev/gormz/advanced
        alias: advanced
      - pkg: gorm.io/gorm
        alias: gorm
  
  # ─── interfacebloat ──────────────────────────────────────────────
  interfacebloat:
    max: 10
  
  # ─── tagalign ────────────────────────────────────────────────────
  tagalign:
    align: true
    sort: true
    order:
      - json
      - yaml
      - xml
      - toml
      - mapstructure
      - validate
      - gorm
      - db
  
  # ─── tagliatelle ─────────────────────────────────────────────────
  tagliatelle:
    case:
      rules:
        json: camel
        yaml: snake
        xml: camel
        bson: camel
        avro: snake
        mapstructure: kebab
  
  # ─── testifylint ─────────────────────────────────────────────────
  testifylint:
    enable-all: true
    disable:
      - require-error
  
  # ─── wrapcheck ───────────────────────────────────────────────────
  wrapcheck:
    ignoreSigs:
      - .Errorf(
      - errors.New(
      - errors.Unwrap(
      - .Wrap(
      - .Wrapf(
      - .WithMessage(
      - .WithMessagef(
      - .WithStack(
    ignorePackageGlobs:
      - encoding/*
      - github.com/pkg/*
    ignoreInterfaceRegexps:
      - ^gorm\.DB$
      - ^gormz\.
  
  # ─── wsl ─────────────────────────────────────────────────────────
  wsl:
    strict-append: true
    allow-assign-and-call: true
    allow-multiline-assign: true
    allow-cuddle-declarations: false
    allow-trailing-comment: true
    force-case-trailing-whitespace: 0
    allow-separated-leading-comment: false
    allow-cuddle-with-calls: []
    allow-cuddle-with-rhs: []
    force-err-cuddling: false

# ═══════════════════════════════════════════════════════════════════
#  Issues — استثناءات
# ═══════════════════════════════════════════════════════════════════
issues:
  # عدد المشاكل المتزامنة
  max-issues-per-linter: 0
  max-same-issues: 0
  
  # التحقق من `nolint`
  exclude-use-default: false
  exclude-case-sensitive: false
  new: false
  fix: false
  
  # ─── استثناءات عامة ──────────────────────────────────────────────
  exclude-rules:
    # استثناءات لملفات الاختبار
    - path: '_test\.go'
      linters:
        - dupl
        - gosec
        - lll
        - funlen
        - goconst
        - gocognit
        - cyclop
        - gocyclo
        - errcheck
        - gomnd
        - forbidigo
        - wrapcheck
        - noctx
        - paralleltest
        - testpackage
      text: ".*"
    
    # استثناءات لملفات benchmarks
    - path: 'benchmark.*\.go'
      linters:
        - lll
        - funlen
        - gomnd
    
    # استثناءات لملفات examples
    - path: 'example.*\.go'
      linters:
        - lll
        - funlen
        - gomnd
        - forbidigo
        - wrapcheck
        - errcheck
        - dupl
        - goconst
    
    # استثناءات لملفات الاختبار fixtures
    - path: 'testdata/'
      linters:
        - all
      text: ".*"
    
    # استثناءات للأخطاء في Wrapcheck
    - linters:
        - wrapcheck
      source: 'return err$'
      text: "returns.*error.*should be wrapped"
    
    # استثناءات للأخطاء في godot
    - path: '.*\.go'
      text: "Comment should end in a period"
      linters:
        - godot
    
    # استثناءات gomnd للأرقام الشائعة
    - linters:
        - gomnd
      text: "Magic number: 0|1|2|3|10|60|100|1000"
    
    # استثناءات للـ contextcheck في Tests
    - path: '_test\.go'
      text: "Function `.*` should pass the context parameter"
      linters:
        - contextcheck
    
    # استثناءات gosec للأخطاء المتكررة
    - linters:
        - gosec
      text: "G404: Use of weak random number generator"
      path: '_test\.go'
    
    # استثناءات stylecheck للأسماء
    - linters:
        - stylecheck
      text: "ST1003: should not use underscores in Go names"
      source: 'gormz\.'
    
    # استثناءات revive
    - linters:
        - revive
      text: "exported: exported .* should have comment or be unexported"
      path: '.*\.go'
    
    # استثناءات godoclint
    - linters:
        - godoclint
      text: "missing.*doc"
      path: 'internal/'
    
    # استثناءات noctx للأمثلة
    - linters:
        - noctx
      path: 'examples/'
      text: ".*"
    
    # استثناءات cyclop لملفات البناء
    - linters:
        - cyclop
      path: 'internal/sqlbuild\.go'
      text: ".*"
    
    # استثناءات lll لملفات التوثيق
    - linters:
        - lll
      source: '^//'
      text: ".*"
    
    # استثناءات goconst للاختبارات
    - linters:
        - goconst
      path: '_test\.go'
      text: ".*"
    
    # استثناءات funlen للـ migrations
    - linters:
        - funlen
      path: '.*migrate.*\.go'
      text: ".*"
    
    # استثناءات dupl للأمثلة
    - linters:
        - dupl
      path: '(example|sample).*\.go'
      text: ".*"

  # استثناءات عامة للنصوص
  exclude:
    - "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*print(f|ln)?|os\\.(Un)?Setenv). is not checked"
    - "exported (type|method|function) (.+) should have comment or be unexported"
    - "ST1000: at least one file in a package should have a package comment"
    - "package comment should be of the form \"(.+)\""
    - "should have a package comment"
    - "comment on exported (type|method|function|var|const) (.+) should be of the form"
    - "type name will be used as (.+)\\.(.+) by other packages, and that stutters; consider calling this (.+)"
    - "func (.+) is unused"
    - "struct field (.+) has json tag but is not exported"

# ═══════════════════════════════════════════════════════════════════
#  Severity — مستوى الخطورة
# ═══════════════════════════════════════════════════════════════════
severity:
  # الإعدادات الافتراضية
  default-severity: warning
  
  # قواعد خاصة
  rules:
    - linters:
        - dupl
      severity: info
    - linters:
        - gocritic
      severity: info
    - linters:
        - godox
      severity: info
    - linters:
        - lll
      severity: info
